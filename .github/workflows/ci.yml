name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Revisión diaria: las listas de la comunidad cambian y conviene enterarse si una fuente se cae.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tests, web y paquetes Samsung/LG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Fuentes en vivo (smoke test)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: node scripts/smoke.mjs

      - name: Empaquetar para LG (.ipk) y Samsung (.wgt)
        run: |
          node scripts/package-webos.mjs
          node scripts/package-tizen.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: tv-packages
          path: release

  android:
    name: APK Android TV / Google TV
    needs: web
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: platforms/android/app/src/main/assets/www
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      # Sin la llave (por ejemplo en pull requests de otros) se genera una APK de depuración.
      - name: Compilar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_PATH" ]; then TASK=assembleRelease; DIR=release; else TASK=assembleDebug; DIR=debug; fi
          gradle -p platforms/android "$TASK" --no-daemon
          mkdir -p out
          cp platforms/android/app/build/outputs/apk/$DIR/*.apk out/TeleLibre.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/TeleLibre.apk

  pages:
    name: Publicar web + descargas (GitHub Pages)
    needs: [web, android]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: site
      # Instaladores con nombre fijo: la URL de descarga nunca cambia entre versiones.
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: tv-packages
          path: packages
      - run: |
          cp packages/*.ipk site/TeleLibre-LG.ipk
          cp packages/*.wgt site/TeleLibre-Samsung.wgt
          ls -la site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    name: Release con instaladores
    needs: [web, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Crear release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          cp artifacts/android/TeleLibre.apk out/TeleLibre-AndroidTV.apk
          cp artifacts/tv-packages/*.ipk out/TeleLibre-LG.ipk
          cp artifacts/tv-packages/*.wgt out/TeleLibre-Samsung.wgt
          gh release create "$GITHUB_REF_NAME" out/* --title "TeleLibre $GITHUB_REF_NAME" --generate-notes
